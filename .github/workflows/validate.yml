name: validate

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      # Full history and tags, so the release warning can find the latest `v*` tag.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # No install step: this repo is dependency-free by design and runs with
      # Node and the claude CLI alone.

      # Asserts each hook by exit code against realistic event JSON, catching a
      # hook that silently stops blocking and one that blocks everything. Parse
      # checks run before behavioural ones, because a syntax error and a
      # deliberate block look identical from outside.
      - name: Hook regression suite
        run: bash scripts/test-hooks.sh

      # Six static checks, none of which `claude plugin validate` performs:
      #
      #   frontmatter  description present and under the 1024-char packaging cap,
      #                skill name matching its directory, and every field one
      #                Claude Code actually reads — `--strict` flags unknown keys
      #                in plugin.json but NOT in component frontmatter (verified
      #                against 2.1.250, 2.1.276 and 2.1.283), so a misspelled
      #                `disallowed-tools` silently stops being enforced. Also
      #                rejects a `<` or `>` in any frontmatter value.
      #   budget       the always-on description total still matches the figure
      #                README.md publishes and stays under its ceiling.
      #   references   every cited .md resolves from the file citing it — a dead
      #                reference is followed at runtime and nothing else catches it.
      #   mcp-names    every blocked mcp__ tool is documented under the skill that
      #                blocks it. This is the one rule resting on a string match
      #                against a tool name a server chooses: when a server renames
      #                a tool the block silently matches nothing.
      #   scripts      every .mjs parses, and every script hooks.json names exists.
      #   versions     every pack carries one shared X.Y.Z `version` in its
      #                plugin.json, and no marketplace.json entry declares one.
      #
      # This is the same script the Stop hook runs locally. It lives in
      # scripts/validate.mjs rather than inline here so that a developer can run
      # the checks before pushing, and so CI and the hook cannot drift apart.
      - name: Marketplace checks
        run: node scripts/validate.mjs

      # Unpinned on purpose: CI checks against the latest release. Validator
      # behaviour moves between releases, so a red build on a commit that changed
      # nothing is the signal to run /cli-upgrade-check.
      - name: Install Claude Code
        run: |
          npm install -g @anthropic-ai/claude-code@latest
          claude --version

      # --strict turns an unrecognised field in plugin.json / marketplace.json into
      # an error, catching a typo such as `mcpServer` for `mcpServers`: Claude Code
      # ignores unknown fields at load time, so without --strict the component
      # silently never loads and nothing fails.
      #
      # It does NOT check component frontmatter — the step above owns that.
      #
      # Every manifest carries `version`, so nothing is expected: any `❯` finding
      # or a non-zero exit fails the target. A new finding on a commit that
      # changed nothing is the signal to run /cli-upgrade-check.
      #
      # The pack list is derived from marketplace.json rather than hardcoded, so
      # adding a pack cannot leave it unvalidated here.
      - name: Validate marketplace and plugins
        run: |
          fail=0
          targets=". $(node -p "require('./.claude-plugin/marketplace.json').plugins.map(p => p.source).join(' ')")"
          for target in $targets; do
            code=0
            out="$(claude plugin validate "$target" --strict 2>&1)" || code=$?
            findings="$(printf '%s\n' "$out" | grep '❯' || true)"
            if [ "$code" -ne 0 ] || [ -n "$findings" ]; then
              echo "::error::$target failed claude plugin validate --strict (exit $code)"
              printf '%s\n' "$out"
              fail=1
            else
              echo "$target ok"
            fi
          done
          exit "$fail"

      # Unreleased commits are not an error: a release is a deliberate bump, so
      # this only reminds that plugins/ changed since the latest `v*` tag.
      - name: Release warning
        run: |
          if ! tag="$(git describe --tags --match 'v*' --abbrev=0 2>/dev/null)"; then
            echo "::warning::Nothing is released yet: no v* tag exists."
          elif ! git diff --quiet "$tag" HEAD -- plugins/; then
            echo "::warning::plugins/ changed since $tag and is unreleased; run /release to ship it."
          else
            echo "plugins/ unchanged since $tag"
          fi
