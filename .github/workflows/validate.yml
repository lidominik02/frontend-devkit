name: validate

on:
  push:
    branches: [main, dev]
  pull_request:
  # Weekly, so a new CLI release that changes the validator surfaces on a quiet week.
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

# Only a pull request cancels its superseded run in progress: a push to dev or main must
# not cancel the release commit's run, the green run that moving main waits on.
concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# No install step for the repo itself: it is dependency-free by design and runs with
# Node and the claude CLI alone.

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: '22'
          - os: ubuntu-latest
            node: '24'
          - os: ubuntu-latest
            node: '26'
          - os: windows-latest
            node: '22'
          - os: macos-latest
            node: '22'
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}

      # The static checks `claude plugin validate` does not perform; each is described in
      # docs/contributing/validation.md.
      # The same script the Stop hook runs locally, so CI and the hook cannot drift apart.
      - name: Marketplace checks
        run: node scripts/validate.mjs

      # Script and hook behaviour by exit code against realistic event JSON, catching a
      # hook that silently stops blocking and one that blocks everything.
      - name: Test suite
        run: node --test "scripts/test/*.test.mjs"

  marketplace:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Full history and tags, so the release warning can find the latest `v*` tag.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      # Unpinned on purpose: CI checks against the latest release. Validator behaviour
      # moves between releases, so a red build on a commit that changed nothing is the
      # signal to run /cli-upgrade-check.
      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code@latest

      - name: Claude Code version
        run: claude --version

      # --strict turns an unrecognised field in plugin.json / marketplace.json into an
      # error, catching a typo such as `mcpServer` for `mcpServers`: Claude Code ignores
      # unknown fields at load time, so without --strict the component silently never
      # loads and nothing fails. It does NOT check component frontmatter; validate.mjs
      # owns that. The targets come from marketplace.json, so a new pack cannot go
      # unvalidated.
      - name: Validate marketplace and plugins
        run: node scripts/ci/plugin-validate.mjs

      # Unreleased commits are not an error: a release is a deliberate bump, so this
      # only reminds that plugins/ or .claude-plugin/ changed since the latest `v*` tag.
      - name: Release warning
        run: node scripts/ci/release-warning.mjs
