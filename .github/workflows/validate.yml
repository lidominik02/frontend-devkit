name: validate

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Only a pull request cancels its superseded run in progress: a push to dev or main must
# not cancel the release commit's run, the green run that moving main waits on.
concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# No install step for the repo itself: it is dependency-free by design and runs with
# Node and the claude CLI alone.

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: '22'
          - os: ubuntu-latest
            node: '24'
          - os: ubuntu-latest
            node: '26'
          - os: windows-latest
            node: '22'
          - os: macos-latest
            node: '22'
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}

      # The static checks `claude plugin validate` does not perform; each is described in
      # docs/contributing/validation.md.
      # The same script the Stop hook runs locally, so CI and the hook cannot drift apart.
      - name: Marketplace checks
        run: node scripts/validate.mjs

      # Script and hook behaviour by exit code against realistic event JSON, catching a
      # hook that silently stops blocking and one that blocks everything.
      - name: Test suite
        run: node --test "scripts/test/*.test.mjs"

  marketplace:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      # Pinned: the merge gate runs one known CLI, so a red build means the commit changed
      # something. canary.yml runs the same validation on the latest release weekly; a red
      # canary is the signal to run /cli-upgrade-check, which raises this pin and the one
      # in release.yml.
      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code@2.1.292

      - name: Claude Code version
        run: claude --version

      # --strict turns an unrecognised field in plugin.json / marketplace.json into an
      # error, catching a typo such as `mcpServer` for `mcpServers`: Claude Code ignores
      # unknown fields at load time, so without --strict the component silently never
      # loads and nothing fails. It does NOT check component frontmatter; validate.mjs
      # owns that. The targets come from marketplace.json, so a new pack cannot go
      # unvalidated. The exit code is the gate: on 2.1.292 --strict exits 1 on a warning
      # (observed 2026-10-12).
      - name: Validate marketplace and plugins
        run: |
          set -e
          claude plugin validate . --strict
          for src in $(node -e 'for (const p of JSON.parse(require("fs").readFileSync(".claude-plugin/marketplace.json","utf8")).plugins) console.log(p.source)'); do
            claude plugin validate "$src" --strict
          done
