name: release

on:
  push:
    tags: ['v*']

# The only workflow that writes: it creates the GitHub Release. validate.yml stays read-only.
permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Marketplace checks
        run: node scripts/validate.mjs

      - name: Test suite
        run: node --test "scripts/test/*.test.mjs"

      # The release notes are the tagged version's CHANGELOG.md section, from its
      # `## X.Y.Z - YYYY-MM-DD` heading up to the next `## `; validate.mjs's changelog check
      # requires the same heading through the same matcher.
      - name: Release notes
        run: node scripts/ci/release-notes.mjs "$GITHUB_REF_NAME" "$RUNNER_TEMP/release-notes.md"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/release-notes.md"
