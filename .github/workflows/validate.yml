name: validate

on:
  push:
    branches: [main, dev]
  pull_request:
  # Weekly, so a new CLI release that changes the validator surfaces on a quiet week.
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

# Only a pull request cancels its superseded run in progress: a push to dev or main must
# not cancel the release commit's run, the green run that moving main waits on.
concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# No install step for the repo itself: it is dependency-free by design and runs with
# Node and the claude CLI alone.

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: '22'
          - os: ubuntu-latest
            node: '24'
          - os: ubuntu-latest
            node: '26'
          - os: windows-latest
            node: '22'
          - os: macos-latest
            node: '22'
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}

      # Nine static checks, none of which `claude plugin validate` performs:
      #
      #   frontmatter  in every shipped component and every skill and agent under
      #                .claude/: description present, under the 1024-char packaging
      #                cap and free of `<` and `>`, skill name kebab-case and matching
      #                its directory, agent name present and free of `:`, and every
      #                field one Claude Code actually reads — `--strict` flags unknown
      #                keys in plugin.json but NOT in component frontmatter (verified
      #                against 2.1.250, 2.1.276, 2.1.278 and 2.1.283), so a misspelled
      #                `disallowed-tools` silently stops being enforced.
      #   skill-dirs   every skill directory holds a SKILL.md.
      #   budget       the always-on description total of the shipped packs still
      #                matches the figure README.md publishes and stays under its
      #                ceiling.
      #   references   every cited .md resolves from the file citing it — a dead
      #                reference is followed at runtime and nothing else catches it.
      #   mcp-names    every blocked mcp__ tool is documented under the skill that
      #                blocks it: when a server renames a tool the block silently
      #                matches nothing.
      #   scripts      every .mjs parses, and every hooks.json arg is a file inside
      #                its own pack.
      #   plugin-root  every ${CLAUDE_PLUGIN_ROOT}/ path in a .md under a pack's
      #                skills/ or agents/ resolves inside that pack.
      #   versions     every pack carries one shared X.Y.Z `version` in its
      #                plugin.json, no marketplace.json entry declares one, and
      #                every plugins/ directory has an entry.
      #   changelog    CHANGELOG.md has a dated section for that version.
      #
      # The same script the Stop hook runs locally, so CI and the hook cannot drift apart.
      - name: Marketplace checks
        run: node scripts/validate.mjs

      # Script and hook behaviour by exit code against realistic event JSON, catching a
      # hook that silently stops blocking and one that blocks everything.
      - name: Test suite
        run: node --test "scripts/test/*.test.mjs"

  marketplace:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Full history and tags, so the release warning can find the latest `v*` tag.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      # Unpinned on purpose: CI checks against the latest release. Validator behaviour
      # moves between releases, so a red build on a commit that changed nothing is the
      # signal to run /cli-upgrade-check.
      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code@latest

      - name: Claude Code version
        run: claude --version

      # --strict turns an unrecognised field in plugin.json / marketplace.json into an
      # error, catching a typo such as `mcpServer` for `mcpServers`: Claude Code ignores
      # unknown fields at load time, so without --strict the component silently never
      # loads and nothing fails. It does NOT check component frontmatter; validate.mjs
      # owns that. The targets come from marketplace.json, so a new pack cannot go
      # unvalidated.
      - name: Validate marketplace and plugins
        run: node scripts/ci/plugin-validate.mjs

      # Unreleased commits are not an error: a release is a deliberate bump, so this
      # only reminds that plugins/ or .claude-plugin/ changed since the latest `v*` tag.
      - name: Release warning
        run: node scripts/ci/release-warning.mjs
